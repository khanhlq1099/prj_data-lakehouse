version: '3'
x-minio-common: &minio-common
  image: quay.io/minio/minio
  container_name: minio-container
  hostname: minio
  ports:
    - "9000:9000"
    - "9001:9001"
  command: server --console-address ":9001" /data
  env_file: .env

x-airflow-common: &airflow-common
  image: apache-airflow:customize
  # build: .
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    # - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./src:/data-lake-house/src
    - ./spark/app:/data-lake-house/spark/app # Spark scripts folder (Must be the same path in airflow and Spark Cluster)
    - ./spark/resources:/data-lake-house/spark/resources #Resources folder (Must be the same path in airflow and Spark Cluster)
  user: "${AIRFLOW_UID}:0"
  env_file:
    - .env
  # networks: 
  #     - default_net

x-depends-on: &depends-on
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:13
    container_name: postgres-container
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # networks: 
    #   - default_net

  minio:
    <<: *minio-common
    hostname: minio
    volumes:
      - .docker/minio:/data
    env_file:
      - .env
    # networks:
    #   - default_net

  selenium:
    image: selenium/standalone-chrome
    container_name: selenium-container
    hostname: selenium
    ports:
      - "4444:4444"
    # networks:
    #   - default_net

  airflow-webserver:
    <<: [*airflow-common, *depends-on]
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: always
    # networks: 
    #   - default_net

  airflow-scheduler:
    <<: [*airflow-common, *depends-on]
    container_name: airflow-scheduler
    command: scheduler
    restart: on-failure
    ports:
      - "8793:8793"
    # networks: 
    #   - default_net  

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    # networks: 
    #   - default_net
      
  spark:
    image: bitnami/spark:3.5.0
    # image: spark:3.5.0-scala2.12-java11-python3-ubuntu
    container_name: spark-container
    hostname: spark
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_MASTER_HOST=spark
      # - SPARK_RPC_AUTHENTICATION_ENABLED=no
      # - SPARK_RPC_ENCRYPTION_ENABLED=no
      # - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      # - SPARK_SSL_ENABLED=no
      - SPARK_LOCAL_IP=spark
      # - SPARK_WORKLOAD=master
    volumes:
      - ./spark/app:/data-lake-house/spark/app # Spark scripts folder (Must be the same path in airflow and Spark Cluster)
      - ./spark/resources:/data-lake-house/spark/resources #Resources folder (Must be the same path in airflow and Spark Cluster)
    ports:
      - "8181:8080"
      - "7077:7077"
    # networks: 
    #   - default_net
  spark-worker-a:
    image: bitnami/spark:3.5.0
    # ports:
    #   - "8182:8080"
    depends_on:
      - spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_MASTER_HOST=spark
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/app:/data-lake-house/spark/app # Spark scripts folder (Must be the same path in airflow and Spark Cluster)
      - ./spark/resources:/data-lake-house/spark/resources #Resources folder (Must be the same path in airflow and Spark Cluster)
  spark-worker-b:
    image: bitnami/spark:3.5.0
    # ports:
    #   - "8183:8080"
    depends_on:
      - spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_MASTER_HOST=spark
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/app:/data-lake-house/spark/app # Spark scripts folder (Must be the same path in airflow and Spark Cluster)
      - ./spark/resources:/data-lake-house/spark/resources #Resources folder (Must be the same path in airflow and Spark Cluster)
      
volumes:
  postgres_data:
  minio: {}

# networks:
#     default_net: